<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Woody Library · Físico</title><link rel="icon" type="image/png" href="woody-library.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1d1b19"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Woody Físico"><link rel="apple-touch-icon" href="icono-180.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="fisico.css"><link rel="stylesheet" href="movil.css"><link rel="stylesheet" href="prioridades.css"></head>
<body>
<header class="sidebar topbar"><div class="brand"><img src="woody-library.png" alt="" width="51" height="40"><span>Woody <b>Físico</b></span></div><label class="search">⌕ <input id="search" placeholder="Buscar autor, título o comentario…" aria-label="Buscar"></label>
<nav class="views" aria-label="Secciones"><button class="nav active" data-view="obras">▦ <span class="lbl">Obras</span></button><button class="nav" data-view="autores">✎ <span class="lbl">Autores</span></button><button class="nav" data-view="puntuaciones">☆ <span class="lbl">Puntuaciones</span></button><button class="nav" data-view="novedades">🔔 <span class="lbl">Novedades</span> <span id="novCount" class="count"></span></button><button class="nav" data-view="extras">✂ <span class="lbl">Extras</span></button><button class="nav" data-view="prioridades">⚑ <span class="lbl">Prioridades</span></button><button class="nav" data-view="descubrir">☠ <span class="lbl">Descubrir</span></button><button class="nav" data-view="revisar">◈ <span class="lbl">Por revisar</span> <span id="revCount" class="count">0</span></button></nav>
<button id="nueva" class="icon-btn" title="Añadir una obra leída">＋</button><button id="infoBtn" class="icon-btn" aria-expanded="false" aria-controls="infoPanel" title="Información">ⓘ</button></header>
<div id="infoPanel" class="info-panel" hidden><p id="summary">Cargando…</p><p id="jobText"></p><button id="bajar">↓ Completar portadas</button><p class="fine"><span class="dot"></span>Programa aparte: no toca nada de tu biblioteca digital.</p></div>
<main>
<div id="estados" class="chips" role="group" aria-label="Estado"></div>
<div class="toolbar"><select id="estante" aria-label="Categoría"></select><select id="editorial" aria-label="Editorial"></select><select id="nota" aria-label="Nota"></select><select id="idioma" aria-label="Idioma"></select><select id="orden" aria-label="Orden"><option value="titulo">Título A–Z</option><option value="estanteria">Orden de estantería</option><option value="nota">Mejor nota</option><option value="notaasc">Peor nota</option><option value="autor">Autor A–Z</option><option value="tomos">Más tomos</option><option value="reciente">Valorada hace poco</option><option value="wk">Mejor nota Whakoom</option></select><span class="grow"></span><span id="contador" class="contador"></span><div class="seg" role="group" aria-label="Vista"><button data-modo="cuadro" class="on" title="Portadas">▦</button><button data-modo="lista" title="Listado">☰</button></div></div>
<div id="crumb" class="crumb" hidden><button id="volver">← Autores</button><h1 id="crumbTitle"></h1></div>
<section id="grid" class="grid"></section>
</main>
<dialog id="detail"><button class="close" id="closeDetail" aria-label="Cerrar ficha">×</button><div id="detailContent"></div></dialog>
<dialog id="alta" class="confirm-box"><button class="close" id="closeAlta" aria-label="Cerrar">×</button><h2>Añadir obra leída</h2><p>Para lo que lees sin tenerlo en Whakoom.</p><form id="altaForm" class="form"><label>Título<input name="titulo" required></label><label>Autores<input name="autores" placeholder="Separados por comas"></label><label>Nota<select name="valoracion" id="altaNota"></select></label><label>Comentario<textarea name="comentario" rows="4"></textarea></label><button class="primary">Añadir</button></form></dialog>
<div id="zoom" hidden><img alt="Portada ampliada"></div>
<div id="toast" role="status" hidden></div>
<script src="nube.js"></script><script src="app.js"></script><script src="isbn.js"></script><script src="prioridades.js"></script></body></html>
